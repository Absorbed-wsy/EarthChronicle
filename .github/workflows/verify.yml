name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned dependencies
        run: ./desktop/prepare.ps1
      - name: Test JavaScript and database behavior
        run: |
          ./runtime/node.exe --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native request handling
        run: ./desktop/test.ps1
      - name: Build Windows executable
        run: ./desktop/build.ps1
