<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7f7">
  <title>地球史书 · Earth Chronicle</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="地球史书首页"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14"/><ellipse cx="20" cy="20" rx="6" ry="14"/><path d="M6 20h28M9 12h22M9 28h22"/></svg><span><b>地球史书</b><small>EARTH CHRONICLE</small></span></a>
    <div class="view-title">文明历史</div>
    <div class="header-actions"><button id="add-button" class="accent-button history-action" disabled hidden><span>＋</span> 记录事件</button><button id="settings-button" class="icon-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.3-1.5.9-2.3-.6-2.4 4.1 1.7 1.7v1.7l-1.7 1.7 2.4 4.1 2.3-.6 1.5.9.6 2.3h5l.6-2.3 1.5-.9 2.3.6 2.4-4.1-1.7-1.7v-1.7l1.7-1.7-2.4-4.1-2.3.6-1.5-.9L14.5 3Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </header>
  <main class="workspace">
    <aside id="explorer" class="explorer" aria-label="事件浏览">
      <div class="explorer-heading"><span class="eyebrow" id="chapter-kicker">WORLD · HISTORY</span><h1 id="chapter-title">世界历史</h1></div>
      <div id="history-controls">
        <div class="country-filter"><label for="country-filter">国家</label><select id="country-filter" aria-label="国家"><option value="CN">中国</option><option value="all">全部</option></select></div>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索事件" aria-label="搜索事件"></label>
        <div class="location-filters"><label>地区<select id="region-filter" aria-label="地区"><option value="all">全部</option></select></label><label>城市<select id="city-filter" aria-label="城市"><option value="all">全部</option></select></label></div>
        <div class="time-filters"><label class="period-control"><span>朝代 / 时期</span><select id="period-filter" aria-label="朝代或时期"><option value="all">全部</option></select></label><label class="year-filter-label"><span>年份</span><select id="year-filter" aria-label="年份"><option value="">年份</option></select></label></div>
        <div class="filter-row"><select id="scope" aria-label="时间范围"><option value="year">当前年份</option><option value="nearby">前后五年</option><option value="all">全部年份</option></select><select id="category" aria-label="事件类型"><option value="all">全部类型</option></select></div>
      </div>
      <div class="list-caption"><span id="list-label">事件列表</span><span id="event-count">—</span></div>
      <div id="event-list" class="event-list" aria-live="polite"><div class="loading-state">加载中…</div></div>
      <footer class="explorer-footer"><span id="coverage">世界历史</span><button id="sources-button" class="text-button">资料来源 ↗</button></footer>
    </aside>
    <div id="explorer-resizer" class="panel-resizer" role="separator" tabindex="0" aria-label="调整事件列表宽度" aria-orientation="vertical" aria-controls="explorer" aria-valuemin="240" aria-valuemax="440" aria-valuenow="240" title="拖动调整列表宽度；也可用左右方向键"></div>
    <section class="earth-stage" aria-label="交互式地图">
      <div id="globe"></div>
      <div id="map-pick-bar" class="map-pick-bar" hidden role="status"><span>点击地图选择位置</span><button id="cancel-map-pick" type="button">取消</button></div>
      <div id="globe-error" class="globe-error" hidden><b>地球画面暂时无法显示</b><p>请使用支持 WebGL 2 的 Edge 或 Chrome，并开启浏览器硬件加速。事件阅读仍然可用。</p><button id="retry-globe" class="quiet-button">重新载入</button></div>
      <div class="map-controls" aria-label="地图视角"><button id="map-projection" title="展开为平面地图" aria-label="展开为平面地图" aria-pressed="false" disabled>2D</button><button id="map-tilt" title="倾斜查看地形" aria-label="倾斜查看地形" aria-pressed="false" disabled>斜</button><button id="north-view" title="朝北 · 点击恢复北向上" aria-label="朝北" disabled><span class="compass-arrow" aria-hidden="true">▲</span><small aria-hidden="true">N</small></button><button id="home-view" title="返回地球全景" aria-label="返回地球全景">◎</button><button id="zoom-in" title="放大" aria-label="放大">＋</button><button id="zoom-out" title="缩小" aria-label="缩小">−</button><button id="labels-toggle" class="active" title="显示地名" aria-label="显示地名" aria-pressed="true">名</button></div>
    </section>
    <div id="detail-resizer" class="panel-resizer" role="separator" tabindex="0" aria-label="调整详情面板宽度" aria-orientation="vertical" aria-controls="detail" aria-valuemin="260" aria-valuemax="480" aria-valuenow="260" title="拖动调整详情宽度；也可用左右方向键"></div>
    <aside id="detail" class="detail" aria-label="事件详情"><div class="detail-empty"><span class="eyebrow">EVENT DETAILS</span><h2>事件详情</h2><p>选择事件查看详情。</p></div></aside>
    <div id="timeline-resizer" class="timeline-resizer" role="separator" tabindex="0" aria-label="调整时间轴高度" aria-orientation="horizontal" aria-controls="timeline" aria-valuemin="88" aria-valuemax="300" aria-valuenow="88" title="上下拖动调整时间轴高度"></div>
    <section id="timeline" class="timeline" aria-label="时间轴">
      <div class="time-display"><div class="year-heading"><span class="eyebrow" id="time-unit">年份</span><select id="year-era" aria-label="纪年"><option value="ce">公元</option><option value="bce">公元前</option></select></div><div class="year-line"><input id="year-input" type="number" min="1" max="9999" aria-label="当前年份"></div><span id="era-label"></span></div>
      <div class="timeline-track-section"><div class="timeline-toolbar"><div class="playback"><button id="previous-node" aria-label="上一事件年份" title="上一事件年份">«</button><button id="previous-year" aria-label="前一年" title="前一年">‹</button><button id="play" aria-label="播放时间轴" title="播放时间轴">▶</button><button id="next-year" aria-label="后一年" title="后一年">›</button><button id="next-node" aria-label="下一事件年份" title="下一事件年份">»</button></div><div class="timeline-links"><button id="jump-start" class="text-button">起点</button><button id="jump-end" class="text-button">终点</button></div></div><div class="range-wrap"><div id="event-dots" class="event-dots"></div><input id="time-slider" type="range" step="1" aria-label="浏览年份"></div><div id="time-ticks" class="time-ticks"></div></div>
    </section>
  </main>
  <dialog id="event-dialog" class="modal event-modal"><form id="event-form">
    <div class="modal-heading"><h2>记录事件</h2><button type="button" data-close="event-dialog" class="close-button" aria-label="关闭">×</button></div>
    <label>标题<input name="title" required maxlength="160"></label>
    <div class="form-row"><label>起始年份<div class="event-year-field"><select name="yearEra" aria-label="起始纪年"><option value="ce">公元</option><option value="bce">公元前</option></select><input name="year" type="number" required min="1" max="9999" aria-label="起始年份"></div></label><label>结束年份 <span class="optional">可选</span><div class="event-year-field"><select name="endEra" aria-label="结束纪年"><option value="ce">公元</option><option value="bce">公元前</option></select><input name="endYear" type="number" min="1" max="9999" aria-label="结束年份"></div></label></div>
    <div class="event-location-heading"><b>地图位置</b><span id="event-coordinates"></span><button id="pick-event-location" type="button" class="text-button">重新选点</button></div>
    <div class="form-row"><label>地点名称<input name="locationName" required maxlength="120"></label><label>国家<select name="countryCode" required aria-label="事件国家"></select></label></div>
    <div class="form-row"><label>地区 <span class="optional">可选</span><input name="regionName" maxlength="100"></label><label>城市 <span class="optional">可选</span><input name="cityName" maxlength="100" list="event-city-options" autocomplete="off"><datalist id="event-city-options"></datalist></label></div>
    <label>类型<select name="category" id="event-category"></select></label>
    <label>事件记述<textarea name="summary" rows="3" required maxlength="6000"></textarea></label>
    <div class="form-row"><label>来源名称 <span class="optional">可选</span><input name="sourceTitle" maxlength="300" placeholder="个人记录"></label><label>来源链接 <span class="optional">可选</span><input name="sourceUrl" type="url" maxlength="2000" placeholder="https://"></label></div>
    <p id="form-error" class="form-error" role="alert"></p><div class="form-actions"><button type="button" data-close="event-dialog" class="quiet-button">取消</button><button type="submit" class="accent-button">保存</button></div>
  </form></dialog>
  <dialog id="delete-event-dialog" class="modal confirm-modal" role="alertdialog" aria-labelledby="delete-event-heading" aria-describedby="delete-event-message delete-event-name delete-event-warning">
    <form id="delete-event-form">
      <div class="modal-heading"><h2 id="delete-event-heading">删除事件</h2><button type="button" data-close="delete-event-dialog" class="close-button" aria-label="关闭">×</button></div>
      <p id="delete-event-message">确定删除此自定义事件？</p>
      <p id="delete-event-name" class="confirm-event-name"></p>
      <p id="delete-event-warning" class="muted">事件及其地图标记将一并移除，无法撤销。</p>
      <p id="delete-event-error" class="form-error" role="alert" hidden></p>
      <div class="form-actions"><button id="cancel-delete-event" type="button" data-close="delete-event-dialog" class="quiet-button" autofocus>取消</button><button id="confirm-delete-event" type="submit" class="accent-button danger-button">删除</button></div>
    </form>
  </dialog>
  <dialog id="settings-dialog" class="modal settings-modal" aria-labelledby="settings-title">
    <div class="modal-heading settings-heading"><h2 id="settings-title">设置</h2><button data-close="settings-dialog" class="close-button" aria-label="关闭设置">×</button></div>
    <div class="settings-tabs" role="tablist" aria-label="设置分类"><button id="appearance-settings-tab" class="active" role="tab" aria-selected="true" aria-controls="appearance-settings" data-settings-tab="appearance">外观与显示</button><button id="map-settings-tab" role="tab" aria-selected="false" aria-controls="map-settings" data-settings-tab="map">地图</button><button id="server-settings-tab" role="tab" aria-selected="false" aria-controls="server-settings" data-settings-tab="server" hidden>内容服务器</button><button id="database-settings-tab" role="tab" aria-selected="false" aria-controls="database-settings" data-settings-tab="database" hidden>数据库</button></div>
    <section id="appearance-settings" class="settings-section" role="tabpanel" aria-labelledby="appearance-settings-tab">
      <div class="setting-row"><b>皮肤</b><label class="theme-control"><select id="theme-select" aria-label="选择皮肤"><option value="light">晨光 · 浅色</option><option value="paper">书页 · 暖色</option><option value="night">夜航 · 深色</option></select></label></div>
      <h3>显示选项</h3>
      <label class="setting-row"><b>事件列表</b><input id="display-explorer" type="checkbox" checked></label>
      <label class="setting-row"><b>详情面板</b><input id="display-detail" type="checkbox" checked></label>
      <label class="setting-row"><b>时间轴</b><input id="display-timeline" type="checkbox" checked></label>
      <p id="preferences-status" class="settings-note" role="status"></p>
    </section>
    <section id="map-settings" class="settings-section" role="tabpanel" aria-labelledby="map-settings-tab" hidden>
      <label class="setting-row"><b>底图</b><select id="map-source"><option value="roads">在线道路地图</option><option value="offline">离线基础底图</option></select></label>
      <label class="setting-row"><b>真实地形</b><input id="map-terrain" type="checkbox" checked></label>
      <label class="setting-row"><b>画面质量</b><select id="map-quality"><option value="auto">自适应</option><option value="high">清晰优先</option><option value="smooth">流畅优先</option></select></label>
      <p id="map-status" class="settings-note" role="status"></p>
      <button id="map-retry" class="quiet-button" hidden>重新连接</button>
    </section>
    <section id="server-settings" class="settings-section" role="tabpanel" aria-labelledby="server-settings-tab" hidden>
      <form id="server-form"><label class="setting-row"><b>开启内容服务器</b><input id="server-enabled" name="enabled" type="checkbox"></label><label class="setting-field" for="content-port">网页访问端口<input id="content-port" name="port" type="number" min="1024" max="65535" required value="8080"></label><div class="settings-actions"><button type="submit" class="accent-button">保存</button></div></form>
      <div id="server-status" class="server-status" role="status"></div><div id="server-addresses" class="library-addresses" hidden></div>
    </section>
    <section id="database-settings" class="settings-section" role="tabpanel" aria-labelledby="database-settings-tab" hidden>
      <div id="database-stats" class="library-stats"></div>
      <div class="settings-actions"><button id="export-database" class="quiet-button">导出数据库</button><label class="import-label">导入数据库<input id="import-database" type="file" accept=".sqlite,.db,application/vnd.sqlite3,application/octet-stream" hidden></label></div>
      <p id="database-status" class="settings-note" role="status"></p>
    </section>
  </dialog>
  <dialog id="sources-dialog" class="modal"><div class="modal-heading"><div><span class="eyebrow">SOURCES & CONTEXT</span><h2>资料来源</h2></div><button data-close="sources-dialog" class="close-button" aria-label="关闭">×</button></div><div id="sources-content" class="reading"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
